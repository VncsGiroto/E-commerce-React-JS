name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  back-end:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: back-end/package-lock.json
      - run: npm ci --no-fund
      - run: node --check app.js
      - run: find controllers middlewares routes models db -name '*.js' -exec node --check {} +
      - run: npm audit --audit-level=high
      - run: npm test

  front-end:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front-end/package-lock.json
      - run: npm ci --no-fund
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build
